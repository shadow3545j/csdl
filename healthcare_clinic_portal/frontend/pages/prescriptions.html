
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn thuốc | HealthCare</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
<div class="app-layout">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="navbar-container"></div>

        <section class="page-content">

            <div class="page-heading">
                <div>
                    <h1>Quản lý đơn thuốc</h1>
                    <p>Tra cứu đơn thuốc và theo dõi quá trình cấp phát.</p>
                </div>
            </div>

            <div id="message" class="hidden"></div>

            <div class="card">

                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;">

                    <input
                        type="text"
                        id="search-prescription"
                        class="form-control search-box"
                        placeholder="Tìm mã đơn thuốc hoặc bệnh nhân..."
                    >

                    <select
                        id="filter-prescription-status"
                        class="form-control"
                        style="max-width:200px;"
                    >
                        <option value="">Tất cả trạng thái</option>
                        <option value="Active">Active</option>
                        <option value="Dispensed">Dispensed</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>

                    <button class="btn btn-secondary" id="refresh-prescriptions">
                        ↻ Làm mới
                    </button>

                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã đơn thuốc</th>
                                <th>Mã hồ sơ</th>
                                <th>Bệnh nhân</th>
                                <th>Ngày kê</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>

                        <tbody id="prescriptions-table">
                            <tr>
                                <td colspan="6" class="empty-state">
                                    Đang tải dữ liệu...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </section>

        <div id="footer-container"></div>
    </main>
</div>

<div class="modal" id="prescription-modal">
    <div class="modal-content">

        <div class="modal-header">
            <h2>Chi tiết đơn thuốc</h2>
            <button class="btn btn-secondary" id="close-prescription-modal">
                Đóng
            </button>
        </div>

        <div id="prescription-detail">
            <div class="loading">Đang tải dữ liệu...</div>
        </div>

    </div>
</div>

<script src="../js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/prescriptions.js"></script>
</body>
</html>
